<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="css/estilos.css">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción — Club de Informática SMR</title>
    <!-- 1. Enlaza aquí tu hoja de estilos externa: css/estilos.css -->

</head>
<body>
<div id="cabecera">
    <h1 >Club de Informática SMR</h1>
    <p>Aprende, monta y repara con nosotros</p>


    <nav>
        <a href="index.html">Inicio</a>
        <a href="formulario.html">Inscripción</a>
        <a href="https://www.medac.es" target="_blank">MEDAC</a>
    </nav>
</div>
    
    <h2>Formulario de inscripción</h2>
    <p>Rellena tus datos y elige las actividades que te interesan.</p>

    <form action="" method="get">
        
            <div class="seccion">
            <legend>Datos personales</legend>

            <label for="nombre">Nombre y apellidos</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required><br>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Escribe tu correo"><br>

            <label for="clave">Contraseña</label><br>
            <input type="password" id="clave" name="clave" placeholder="Escribe tu contraseña"><br>

            <label for="curso">Curso</label><br>
            <select id="curso" name="curso">
                <option value="1smr">1º SMR</option>
                <option value="2smr" selected>2º SMR</option>
                <option value="otro">Otro ciclo</option>
            </select>
            </div>
        
        
        <div class="seccion">
        
            <legend>Actividades</legend>
            
            <input type="checkbox" id="montaje" name="actividad" value="montaje">
            <label for="montaje">Montaje de un PC</label><br>

            <input type="checkbox" id="wifi" name="actividad" value="wifi">
            <label for="wifi">Red Wi-Fi segura</label><br>

            <input type="checkbox" id="web" name="actividad" value="web" checked>
            <label for="web">Primera web con HTML</label><br>

            <input type="checkbox" id="torneo" name="actividad" value="torneo">
            <label for="torneo">Torneo en red local</label>
        </div>
        
        <div class="seccion"
           
        <fieldset>
           <legend>Turnos</legend>

            <input type="radio" id="tarde" name="turno" value="tarde" checked>
            <label for="tarde">Tarde</label>

            <input type="radio" id="viernes" name="turno" value="viernes">
            <label for="viernes">Viernes por la mañana</label>

            <label for="comentarios">¿Algo que debamos saber?</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>
        </fieldset>
        </div>
        <button type="submit">Enviar inscripción</button>
        <button type="reset">Borrar</button>
    </form>

    <hr>
    <div id="pie">
    <p>© 2026 Club de Informática SMR · <a href="index.html">Volver al inicio</a></p>
    </div>
</body>
</html>
